# Baut die Bridge-Firmware und veroeffentlicht die Flash-Seite (GitHub Pages).
#   - jeder Push auf main, der bridge/ oder flasher/ aendert: bauen + Pages
#   - Tag v*: zusaetzlich Release mit der Firmware-Datei
name: Firmware

on:
  push:
    branches: [main]
    paths: ["bridge/**", "flasher/**", ".github/workflows/firmware.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: firmware
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32-Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Kompilieren
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PartitionScheme=custom,PSRAM=opi \
            --output-dir build bridge/duo_bridge
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="main-$(git rev-parse --short HEAD)"
          mkdir -p site
          cp -r flasher/* site/
          cp build/duo_bridge.ino.merged.bin site/duo_bridge.bin
          sed -i "s/__VERSION__/${VERSION}/" site/manifest.json site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/duo_bridge.ino.merged.bin "duo_bridge-${GITHUB_REF_NAME}.bin"
          gh release create "$GITHUB_REF_NAME" "duo_bridge-${GITHUB_REF_NAME}.bin" \
            --title "Bridge $GITHUB_REF_NAME" --notes "Firmware für den Waveshare ESP32-S3-ETH. Flashen: docs/flashen.md" \
            || gh release upload "$GITHUB_REF_NAME" "duo_bridge-${GITHUB_REF_NAME}.bin" --clobber

  pages:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
