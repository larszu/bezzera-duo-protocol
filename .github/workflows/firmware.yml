# Baut die Bridge-Firmware und veroeffentlicht die Flash-Seite (GitHub Pages).
#   - jeder Push auf main, der bridge/ oder flasher/ aendert: bauen + Pages
#   - Tag v*: zusaetzlich Release mit der Firmware-Datei
name: Firmware

on:
  push:
    branches: [main]
    paths: ["bridge/**", "flasher/**", "tools/firmware_bauen.sh", "tools/anleitung_pdf.py", "docs/**", "README.md", "README.en.md", "tools/seitenbau/**", "tools/display_kopf_c6/**", ".github/workflows/firmware.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: firmware
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32-Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Kompilieren
        run: |
          bash tools/firmware_bauen.sh   # build/s3 und build/esp32
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="main-$(git rev-parse --short HEAD)"
          mkdir -p site
          cp -r flasher/* site/
          mkdir -p site/seitenbau && cp tools/seitenbau/index.html site/seitenbau/
          (cd tools/display_kopf_c6 && zip -r ../../site/display_kopf_c6.zip DWIN_SET)
          cp build/s3/duo_bridge.ino.merged.bin site/duo_bridge.bin
          cp build/s3/duo_bridge.ino.bin site/duo_bridge.ino.bin
          cp build/esp32/duo_bridge.ino.merged.bin site/duo_bridge_esp32.bin
          python3 -m pip install --quiet markdown 2>/dev/null || python3 -m pip install --quiet --break-system-packages markdown
          python3 tools/anleitung_pdf.py --version "$VERSION" --ziel site   # site/anleitung-de.pdf, -en.pdf
          sed -i "s/__VERSION__/${VERSION}/" site/manifest.json site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/s3/duo_bridge.ino.merged.bin "duo_bridge-esp32s3-${GITHUB_REF_NAME}.bin"
          cp build/s3/duo_bridge.ino.bin "duo_bridge-esp32s3-update-${GITHUB_REF_NAME}.bin"
          cp build/esp32/duo_bridge.ino.merged.bin "duo_bridge-esp32-${GITHUB_REF_NAME}.bin"
          cp site/display_kopf_c6.zip "display_kopf_c6.zip"
          cp site/anleitung-de.pdf "bauanleitung-de-${GITHUB_REF_NAME}.pdf"
          cp site/anleitung-en.pdf "build-guide-en-${GITHUB_REF_NAME}.pdf"
          DATEIEN=("duo_bridge-esp32s3-${GITHUB_REF_NAME}.bin" "duo_bridge-esp32s3-update-${GITHUB_REF_NAME}.bin" "duo_bridge-esp32-${GITHUB_REF_NAME}.bin" "display_kopf_c6.zip" "bauanleitung-de-${GITHUB_REF_NAME}.pdf" "build-guide-en-${GITHUB_REF_NAME}.pdf")
          gh release create "$GITHUB_REF_NAME" "${DATEIEN[@]}" --title "Bridge $GITHUB_REF_NAME" --notes-file docs/release-notes.md \
            || gh release upload "$GITHUB_REF_NAME" "${DATEIEN[@]}" --clobber

  pages:
    needs: bauen
    if: github.ref_type != 'tag'  # Pages nimmt nur main an; die Seite baut der Lauf auf main
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
